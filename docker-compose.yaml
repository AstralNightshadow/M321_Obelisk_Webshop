name: obelix
services:
  # build two spring images using: ./gradlew bootBuildImage
  obelix-webshop:
    image: bbw/obelix-webshop:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: common,docker
      OBELIX_CLIENTS_QUARRY_URL: http://obelix-quarry:8081
      OBELIX_CLIENTS_BASKET_URL: http://obelix-basket:8082
    depends_on:
      - obelix-quarry
      - obelix-basket
      - zipkin
  obelix-quarry:
    image: bbw/obelix-quarry:latest
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: common,docker
    depends_on:
      - zipkin
  obelix-basket:
    image: bbw/obelix-basket:latest
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: common,docker
    depends_on:
      - zipkin
  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"
  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus:/tmp/config/:ro
    command: --config.file=/tmp/config/prometheus.yaml
    depends_on:
      - obelix-webshop
      - obelix-quarry
  grafana:
    image: grafana/grafana:12.4.0-19362974299
    environment:
    - GF_SECURITY_ADMIN_USER=admin
    - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
