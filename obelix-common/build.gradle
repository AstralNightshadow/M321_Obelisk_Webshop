plugins {
	id 'java-library'
	id 'java-test-fixtures'
}

dependencies {
	api 'org.springframework.boot:spring-boot-starter-actuator'
	api 'org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry'
	api 'org.springframework.boot:spring-boot-zipkin'
	api 'io.micrometer:micrometer-tracing-bridge-otel'
	api 'io.micrometer:micrometer-registry-prometheus'
	api 'io.opentelemetry:opentelemetry-exporter-zipkin'
	api 'org.springframework.boot:spring-boot-starter-validation'
	api 'org.springframework.boot:spring-boot-starter-web'

	testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
	testFixturesApi 'org.springframework.boot:spring-boot-starter-webflux'
	testFixturesApi 'org.springframework.boot:spring-boot-webtestclient'
	testFixturesApi 'org.assertj:assertj-core'
	testFixturesRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
